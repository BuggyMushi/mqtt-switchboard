<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MQTT Switchboard</title>
  <style>
    /* -------------------------------------------------------------
       1. Base System Tokens (Default: Modern Dark Glassmorphism)
       ------------------------------------------------------------- */
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --item-bg: rgba(255, 255, 255, 0.04);
      --item-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --state-on: #22c55e;
      --state-off: #475569;
      --state-on-glow: rgba(34, 197, 94, 0.35);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-speed: 0.15s;
    }

    /* -------------------------------------------------------------
       2. E-Ink / High-Contrast Monochrome Mode (?eink=1)
       ------------------------------------------------------------- */
    body.eink-mode {
      --bg-color: #ffffff !important;
      --card-bg: #ffffff !important;
      --card-border: #000000 !important;
      --item-bg: #ffffff !important;
      --item-border: #000000 !important;
      --text-main: #000000 !important;
      --text-muted: #222222 !important;
      --accent: #000000 !important;
      --accent-hover: #000000 !important;
      --state-on: #000000 !important;
      --state-off: #ffffff !important;
      --state-on-glow: none !important;
      --transition-speed: 0s !important;
    }

    body.eink-mode * {
      animation: none !important;
      transition: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    body.eink-mode .card,
    body.eink-mode .entity-item,
    body.eink-mode .btn,
    body.eink-mode .order-btn {
      border: 2px solid #000000 !important;
      border-radius: 0px !important;
    }

    body.eink-mode .entity-on {
      background-color: #000000 !important;
      color: #ffffff !important;
    }

    body.eink-mode .entity-on * {
      color: #ffffff !important;
    }

    /* -------------------------------------------------------------
       3. General Styles
       ------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .version-tag {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 11px;
      font-size: 0.82rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .badge-btn:hover, .badge-btn.active {
      color: var(--text-main);
      border-color: var(--accent);
    }

    /* -------------------------------------------------------------
       4. Device Grid & Grouped Cards
       ------------------------------------------------------------- */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform var(--transition-speed), border-color var(--transition-speed);
      position: relative;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--item-border);
      padding-bottom: 8px;
      gap: 10px;
    }

    .device-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .device-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Manufacturer & Firmware Telemetry Badge */
    .device-meta-pill {
      font-size: 0.7rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      white-space: nowrap;
      text-align: right;
    }

    /* Order Adjust Controls (Shown only during Order Edit Mode) */
    .card-order-controls {
      display: none;
      gap: 6px;
      margin-bottom: 6px;
    }

    body.order-mode .card-order-controls {
      display: flex;
    }

    .order-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .order-btn:hover {
      background: var(--accent);
      color: #0b0f19;
    }

    /* -------------------------------------------------------------
       5. Multi-Entity Channel Grid (e.g. 8CH Relays in One Card)
       ------------------------------------------------------------- */
    .entity-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }

    .entity-item {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      cursor: pointer;
      position: relative;
      min-height: 68px;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    .entity-item:hover {
      border-color: var(--accent);
    }

    .entity-item.is-sensor {
      cursor: default;
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      min-height: 36px;
      padding: 6px 12px;
    }

    .entity-item.is-cover {
      grid-column: 1 / -1;
      cursor: default;
    }

    .entity-on {
      background: rgba(34, 197, 94, 0.15) !important;
      border-color: rgba(34, 197, 94, 0.5) !important;
      box-shadow: inset 0 0 10px var(--state-on-glow);
    }

    .entity-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entity-state {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 6px;
      color: var(--text-muted);
    }

    .entity-on .entity-state {
      color: var(--state-on);
    }

    .state-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    /* Cover Actions */
    .cover-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .cover-btn {
      flex: 1;
      padding: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .cover-btn:hover {
      background: var(--accent);
      color: #0b0f19;
    }

    /* Debounce & Loading States */
    .entity-item.loading {
      pointer-events: none !important;
      opacity: 0.6;
    }

    .entity-item.loading::after {
      content: "...";
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-main);
    }

    body.eink-mode .entity-item.loading::after {
      background: rgba(255, 255, 255, 0.9) !important;
      color: #000000 !important;
      border: 2px dashed #000000 !important;
    }

    /* -------------------------------------------------------------
       6. Login Overlay
       ------------------------------------------------------------- */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
    }

    .login-box h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    body.eink-mode .form-input {
      background: #ffffff !important;
      border: 2px solid #000000 !important;
      color: #000000 !important;
      border-radius: 0 !important;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>登入控制台</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">帳號</label>
          <input type="text" id="username" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="login-btn">登入</button>
        <div id="login-error" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
        <line x1="6" y1="6" x2="6.01" y2="6"></line>
        <line x1="6" y1="18" x2="6.01" y2="18"></line>
      </svg>
      <h1>MQTT Switchboard</h1>
      <span class="version-tag" id="dash-version">v1.0.0</span>
      <span class="version-tag" id="mqtt-status-pill">MQTT: 連線中...</span>
    </div>
    <div class="header-actions">
      <div id="order-toolbar" style="display:none; gap:6px;">
        <button class="badge-btn" onclick="publishGlobalOrder()" title="將當前排序儲存至伺服器作為全域預設">[💾 佈達預設]</button>
        <button class="badge-btn" onclick="resetToGlobalOrder()" title="清除本機快取，恢復跟隨全域預設">[↺ 恢復預設]</button>
      </div>
      <button class="badge-btn" id="order-mode-btn" onclick="toggleOrderMode()">[排序]</button>
      <button class="badge-btn" id="toggle-eink" onclick="toggleEinkMode()">[E-Ink]</button>
      <button class="badge-btn" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- Device Grid -->
  <main class="grid-container" id="device-grid">
    <div class="empty-state">正在尋找設備 (監聽 homeassistant/# 與靜態配置)...</div>
  </main>

  <script>
    let rawEntities = {};
    let isEink = false;
    let isOrderMode = false;
    let globalOrder = [];
    let customOrder = []; // Active display order

    // Detect E-Ink from URL query e.g. ?eink=1
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('eink') === '1') {
      enableEink(true);
    }

    function toggleEinkMode() {
      enableEink(!isEink);
    }

    function enableEink(val) {
      isEink = val;
      if (isEink) {
        document.body.classList.add('eink-mode');
        document.getElementById('toggle-eink').innerText = '[色彩模式]';
      } else {
        document.body.classList.remove('eink-mode');
        document.getElementById('toggle-eink').innerText = '[E-Ink]';
      }
    }

    function toggleOrderMode() {
      isOrderMode = !isOrderMode;
      const btn = document.getElementById('order-mode-btn');
      const toolbar = document.getElementById('order-toolbar');
      if (isOrderMode) {
        document.body.classList.add('order-mode');
        btn.classList.add('active');
        btn.innerText = '[完成排序]';
        toolbar.style.display = 'flex';
      } else {
        document.body.classList.remove('order-mode');
        btn.classList.remove('active');
        btn.innerText = '[排序]';
        toolbar.style.display = 'none';
      }
      render();
    }

    function moveCard(grpKey, direction) {
      const idx = customOrder.indexOf(grpKey);
      if (idx === -1) return;
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= customOrder.length) return;

      const temp = customOrder[idx];
      customOrder[idx] = customOrder[newIdx];
      customOrder[newIdx] = temp;

      // Save user-specific override to LocalStorage
      localStorage.setItem('switchboard_card_order', JSON.stringify(customOrder));
      render();
    }

    async function publishGlobalOrder() {
      if (!confirm('確定要將目前的卡片順序「佈達為全域預設值」嗎？\n所有未個別自訂順序的裝置將會自動跟隨此排列。')) return;
      try {
        const res = await fetch('/api/layout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: customOrder })
        });
        if (res.ok) {
          globalOrder = [...customOrder];
          alert('已成功儲存並佈達為全域預設順序！');
        } else {
          alert('儲存全域預設失敗');
        }
      } catch (err) {
        alert('網路連線失敗');
      }
    }

    function resetToGlobalOrder() {
      if (!confirm('確定要清除此瀏覽器的個別排序，並恢復跟隨全域預設嗎？')) return;
      localStorage.removeItem('switchboard_card_order');
      const presentKeys = getPresentGroupKeys();
      customOrder = determineActiveOrder(presentKeys);
      render();
      alert('已恢復跟隨伺服器全域預設順序！');
    }

    // 1. Session Check & Health / Version Fetch
    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          document.getElementById('login-overlay').style.display = 'none';
          fetchHealth();
          initDashboard();
        } else {
          document.getElementById('login-overlay').style.display = 'flex';
        }
      } catch (err) {
        document.getElementById('login-overlay').style.display = 'flex';
      }
    }

    async function fetchHealth() {
      try {
        const res = await fetch('/api/health');
        if (res.ok) {
          const data = await res.json();
          if (data.version) {
            document.getElementById('dash-version').innerText = `v${data.version}`;
          }
          const mqttEl = document.getElementById('mqtt-status-pill');
          if (mqttEl) {
            if (data.mqtt_connected) {
              mqttEl.innerText = 'MQTT: 已連線';
              mqttEl.style.color = 'var(--state-on)';
              mqttEl.style.borderColor = 'rgba(34, 197, 94, 0.4)';
            } else {
              mqttEl.innerText = 'MQTT: 斷線中';
              mqttEl.style.color = '#ef4444';
              mqttEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            }
          }
        }
      } catch (e) {}
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        if (res.ok) {
          document.getElementById('login-overlay').style.display = 'none';
          fetchHealth();
          initDashboard();
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.innerText = data.error || '帳號或密碼錯誤';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.innerText = '網路連線失敗';
        errEl.style.display = 'block';
      }
    });

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.reload();
    }

    async function fetchLayout() {
      try {
        const res = await fetch('/api/layout');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.order)) {
            globalOrder = data.order;
          }
        }
      } catch (err) {}
    }

    function getPresentGroupKeys() {
      const keys = new Set();
      Object.keys(rawEntities).forEach(id => {
        keys.add(rawEntities[id].device_id || 'standalone');
      });
      return Array.from(keys);
    }

    function determineActiveOrder(presentKeys) {
      let baseOrder = [];
      const saved = localStorage.getItem('switchboard_card_order');
      if (saved) {
        try { baseOrder = JSON.parse(saved); } catch (e) {}
      } else if (globalOrder.length > 0) {
        baseOrder = [...globalOrder];
      }

      // Filter out stale/ghost devices that disappeared or went offline
      let active = baseOrder.filter(k => presentKeys.includes(k));

      // Append newly discovered devices to the end
      presentKeys.forEach(k => {
        if (!active.includes(k)) active.push(k);
      });

      return active;
    }

    // 2. Fetch Devices & Realtime Event Setup
    async function initDashboard() {
      await fetchLayout();
      await loadDevices();
      startSSE();
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices');
        if (res.ok) {
          const list = await res.json();
          rawEntities = {};
          list.forEach(d => rawEntities[d.id] = d);
          render();
        }
      } catch (err) {
        console.error('Fetch devices failed:', err);
      }
    }

    function startSSE() {
      const sse = new EventSource('/api/events');
      sse.addEventListener('device', (e) => {
        try {
          const dev = JSON.parse(e.data);
          rawEntities[dev.id] = dev;
          render();
        } catch (err) {}
      });
      sse.onerror = () => {
        setTimeout(loadDevices, 4000);
      };
    }

    // 3. Grouping & Rendering (e.g. Group all 8 CH relays into one Smart Relay Card)
    function render() {
      const grid = document.getElementById('device-grid');
      const entityIds = Object.keys(rawEntities);
      if (entityIds.length === 0) {
        grid.innerHTML = '<div class="empty-state">尚無設備上線。<br>正在監聽 homeassistant/# 與靜態配置...</div>';
        return;
      }

      // Group entities by device_id
      const deviceGroups = {};
      entityIds.forEach(id => {
        const ent = rawEntities[id];
        const devID = ent.device_id || 'standalone';
        if (!deviceGroups[devID]) {
          deviceGroups[devID] = {
            id: devID,
            name: ent.device_name || devID,
            model: ent.device_model || '',
            manufacturer: ent.manufacturer || '',
            firmware: ent.firmware || '',
            entities: []
          };
        }
        deviceGroups[devID].entities.push(ent);
        // Inherit metadata if any entity has it
        if (!deviceGroups[devID].manufacturer && ent.manufacturer) deviceGroups[devID].manufacturer = ent.manufacturer;
        if (!deviceGroups[devID].firmware && ent.firmware) deviceGroups[devID].firmware = ent.firmware;
        if (!deviceGroups[devID].model && ent.device_model) deviceGroups[devID].model = ent.device_model;
      });

      // Synchronize and filter order: handle disappeared devices & new additions
      const presentKeys = Object.keys(deviceGroups);
      customOrder = determineActiveOrder(presentKeys);

      grid.innerHTML = '';

      customOrder.forEach((grpKey, index) => {
        const group = deviceGroups[grpKey];
        if (!group) return;

        // Sort entities inside group naturally (e.g. CH1, CH2 ... CH8)
        group.entities.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `group-${group.id}`;

        // Construct Telemetry Badge: [ Brand · Model · vFW ]
        let metaParts = [];
        if (group.manufacturer) metaParts.push(group.manufacturer);
        if (group.model) metaParts.push(group.model);
        if (group.firmware) metaParts.push(`v${group.firmware}`);
        const metaText = metaParts.join(' · ');

        let cardHTML = `
          <!-- Order Adjust Bar (Visible only in Order Mode) -->
          <div class="card-order-controls">
            <button class="order-btn" onclick="moveCard('${group.id}', -1)" ${index === 0 ? 'disabled' : ''}>◀ 往前</button>
            <button class="order-btn" onclick="moveCard('${group.id}', 1)" ${index === customOrder.length - 1 ? 'disabled' : ''}>往後 ▶</button>
          </div>

          <div class="device-header">
            <div>
              <div class="device-title">${escapeHTML(group.name)}</div>
              <div class="device-subtitle">${escapeHTML(group.id)}</div>
            </div>
            ${metaText ? `<div class="device-meta-pill" title="廠商: ${escapeHTML(group.manufacturer || 'N/A')}, 韌體: ${escapeHTML(group.firmware || 'N/A')}">${escapeHTML(metaText)}</div>` : ''}
          </div>
          <div class="entity-list">
        `;

        group.entities.forEach(ent => {
          const isSwitch = (ent.component === 'switch' || ent.component === 'light');
          const isButton = (ent.component === 'button');
          const isCover = (ent.component === 'cover');
          const isSensor = (ent.component === 'sensor' || ent.component === 'binary_sensor');
          const isOn = (ent.state === 'ON' || ent.state === ent.payload_on);

          let itemClass = 'entity-item';
          if (isOn && isSwitch) itemClass += ' entity-on';
          if (isSensor) itemClass += ' is-sensor';
          if (isCover) itemClass += ' is-cover';

          // Clean display name (remove redundant device prefix if present)
          let shortName = ent.name;
          if (shortName.startsWith(group.name + "_")) {
            shortName = shortName.substring(group.name.length + 1);
          } else if (shortName.startsWith(group.name + " ")) {
            shortName = shortName.substring(group.name.length + 1);
          }

          if (isCover) {
            cardHTML += `
              <div class="${itemClass}" id="entity-${ent.id}">
                <div class="entity-name">${escapeHTML(shortName)}</div>
                <div class="cover-actions">
                  <button class="cover-btn" onclick="handleAction('${ent.id}', 'OPEN')">▲ 開</button>
                  <button class="cover-btn" onclick="handleAction('${ent.id}', 'STOP')">■ 停</button>
                  <button class="cover-btn" onclick="handleAction('${ent.id}', 'CLOSE')">▼ 關</button>
                </div>
              </div>
            `;
          } else if (isSensor) {
            let displayVal = ent.state || 'N/A';
            if (ent.unit) displayVal += ` ${ent.unit}`;
            cardHTML += `
              <div class="${itemClass}" id="entity-${ent.id}">
                <span class="entity-name">${escapeHTML(shortName)}</span>
                <span style="font-weight:700; color:var(--accent);">${escapeHTML(displayVal)}</span>
              </div>
            `;
          } else {
            // Switch, Light, Button
            let statusText = ent.state || 'OFF';
            if (isButton) statusText = '觸發';

            cardHTML += `
              <div class="${itemClass}" id="entity-${ent.id}" onclick="handleAction('${ent.id}')">
                <div class="entity-name">${escapeHTML(shortName)}</div>
                <div class="entity-state">
                  <span>${escapeHTML(statusText)}</span>
                  ${isSwitch ? '<span class="state-dot"></span>' : ''}
                </div>
              </div>
            `;
          }
        });

        cardHTML += `</div>`;
        card.innerHTML = cardHTML;
        grid.appendChild(card);
      });
    }

    // 4. Trigger Action with 1-Second Debounce Protection
    async function handleAction(id, explicitAction = '') {
      const el = document.getElementById(`entity-${id}`);
      if (!el || el.classList.contains('loading')) return;

      // Lock element for 1 second immediately to prevent spam click
      el.classList.add('loading');
      setTimeout(() => {
        el.classList.remove('loading');
      }, 1000);

      try {
        const bodyData = explicitAction ? { action: explicitAction } : {};
        const res = await fetch(`/api/devices/${encodeURIComponent(id)}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        if (!res.ok && res.status === 429) {
          console.warn('Backend debounce active');
        }
      } catch (err) {
        console.error('Trigger device failed:', err);
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Startup
    checkAuth();
  </script>
</body>
</html>
